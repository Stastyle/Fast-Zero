<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- 40x40cm schematic zeroing target, 20px = 1cm -->
  <rect width="800" height="800" fill="#ffffff"/>
  <defs>
    <pattern id="cm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#c8c8c8" stroke-width="1"/>
    </pattern>
    <pattern id="cm5" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#cm)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#8a8a8a" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#cm5)"/>
  <rect x="0" y="0" width="800" height="800" fill="none" stroke="#111111" stroke-width="4"/>
  <!-- crosshair through aim point -->
  <line x1="0" y1="400" x2="800" y2="400" stroke="#555555" stroke-width="2"/>
  <line x1="400" y1="0" x2="400" y2="800" stroke="#555555" stroke-width="2"/>
  <!-- central aim mark -->
  <circle cx="400" cy="400" r="60" fill="none" stroke="#111111" stroke-width="6"/>
  <circle cx="400" cy="400" r="28" fill="#111111"/>
  <line x1="400" y1="384" x2="400" y2="416" stroke="#ffffff" stroke-width="4"/>
  <line x1="384" y1="400" x2="416" y2="400" stroke="#ffffff" stroke-width="4"/>
</svg>
